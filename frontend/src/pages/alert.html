<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook — Alert System</title>
    <link rel="stylesheet" href="../styles/alert.style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ═══════════════════════════════════
     DEMO UI
═══════════════════════════════════ -->
    <h1 class="demo-title">MediBook <em>Alert System</em></h1>
    <p class="demo-subtitle">Universal alert components — toasts, banners & modals for every page</p>

    <!-- TOASTS -->
    <p class="demo-section-label">🔔 Toast Notifications</p>
    <div class="demo-grid">
        <button class="demo-btn error"
            onclick='MediAlert.toast({type:"error",title:"Access Denied",message:"You do not have permission to view this page.",duration:4000})'>
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
            Error Toast
        </button>
        <button class="demo-btn success"
            onclick='MediAlert.toast({type:"success",title:"Appointment Confirmed",message:"Your booking with Dr. Rahman is set for May 23.",duration:4000})'>
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            Success Toast
        </button>
        <button class="demo-btn warning"
            onclick='MediAlert.toast({type:"warning",title:"Session Expiring",message:"Your session will expire in 5 minutes. Save your work.",duration:5000})'>
            <svg viewBox="0 0 24 24">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
            Warning Toast
        </button>
        <button class="demo-btn info"
            onclick='MediAlert.toast({type:"info",title:"New Message",message:"Dr. Kim sent you a follow-up message.",duration:4000})'>
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            Info Toast
        </button>
        <button class="demo-btn" style="border-color:var(--gray-200);"
            onclick='MediAlert.toast({type:"error",title:"Access Denied",message:"You do not have permission to view this.",duration:4000,theme:"dark"})'>
            <svg viewBox="0 0 24 24" style="stroke:var(--gray-400);">
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
            Error (Dark Theme)
        </button>
        <button class="demo-btn" style="border-color:var(--gray-200);"
            onclick='MediAlert.toast({type:"success",title:"Doctor Added",message:"Dr. Nguyen has been successfully registered.",theme:"dark"})'>
            <svg viewBox="0 0 24 24" style="stroke:var(--gray-400);">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            Success (Dark Theme)
        </button>
    </div>

    <!-- BANNERS -->
    <p class="demo-section-label">📋 Inline Alert Banners</p>
    <div class="demo-grid">
        <button class="demo-btn error"
            onclick="showBanner('error','Access Denied','You do not have permission to perform this action. Contact your administrator.')">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
            Error Banner
        </button>
        <button class="demo-btn success"
            onclick="showBanner('success','Changes Saved','Your profile has been updated successfully.')">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            Success Banner
        </button>
        <button class="demo-btn warning"
            onclick="showBanner('warning','Incomplete Profile','Please complete your medical history before booking.',true)">
            <svg viewBox="0 0 24 24">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
            </svg>
            Warning Banner
        </button>
        <button class="demo-btn info"
            onclick="showBanner('info','Scheduled Maintenance','The system will be down on June 5 from 2–4 AM.',true)">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
            </svg>
            Info Banner
        </button>
    </div>

    <!-- Live banner display area -->
    <div class="demo-alerts-area" id="bannerArea"></div>

    <!-- MODALS -->
    <p class="demo-section-label">🪟 Confirm Modals</p>
    <div class="demo-grid">
        <button class="demo-btn error"
            onclick='MediAlert.modal({type:"error",title:"Access Denied",message:"You do not have permission to access this page. Please contact your system administrator.",detail:"Error code: 403 — Forbidden",confirmText:"Go Back",cancelText:"Contact Support",onConfirm:()=>MediAlert.toast({type:"info",title:"Navigating back…"})})'>
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
            Access Denied
        </button>
        <button class="demo-btn error"
            onclick='MediAlert.modal({type:"error",title:"Delete Doctor",message:"Are you sure you want to permanently remove Dr. Sarah Rahman? This will unassign all her patients.",detail:"This action cannot be undone.",confirmText:"Yes, Delete",cancelText:"Keep Doctor",onConfirm:()=>MediAlert.toast({type:"success",title:"Doctor removed",message:"Dr. Rahman has been deleted."})})'>
            <svg viewBox="0 0 24 24">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2" />
            </svg>
            Delete Confirm
        </button>
        <button class="demo-btn success"
            onclick='MediAlert.modal({type:"success",title:"Appointment Booked!",message:"Your appointment with Dr. Sarah Rahman has been confirmed for May 23 at 10:30 AM.",detail:"You will receive a confirmation email shortly.",confirmText:"View Appointment",cancelText:"Close",onConfirm:()=>MediAlert.toast({type:"info",title:"Redirecting…"})})'>
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            Booking Success
        </button>
        <button class="demo-btn warning"
            onclick='MediAlert.modal({type:"warning",title:"Unsaved Changes",message:"You have unsaved changes on this form. If you leave now your progress will be lost.",detail:"Tip: Use Save Draft to keep your progress.",confirmText:"Leave Anyway",cancelText:"Stay & Save",onConfirm:()=>MediAlert.toast({type:"warning",title:"Changes discarded."})})'>
            <svg viewBox="0 0 24 24">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
            </svg>
            Unsaved Changes
        </button>
        <button class="demo-btn info"
            onclick='MediAlert.modal({type:"info",title:"Session Expired",message:"Your session has expired due to inactivity. Please sign in again to continue.",confirmText:"Sign In",cancelText:"Cancel",onConfirm:()=>MediAlert.toast({type:"info",title:"Redirecting to login…"})})'>
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
            </svg>
            Session Expired
        </button>
        <button class="demo-btn confirm"
            onclick='MediAlert.modal({type:"confirm",title:"Cancel Appointment",message:"Are you sure you want to cancel your appointment with Dr. Patel on June 3 at 9:00 AM?",detail:"Free cancellation is available up to 24 hours before.",confirmText:"Yes, Cancel It",cancelText:"Keep Appointment",onConfirm:()=>MediAlert.toast({type:"warning",title:"Appointment cancelled.",message:"Dr. Patel has been notified."})})'>
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
            </svg>
            Cancel Appointment
        </button>
        <button class="demo-btn" style="border-color:var(--gray-200);"
            onclick='MediAlert.modal({type:"error",title:"Access Denied",message:"You do not have permission to manage departments. Super Administrator role required.",detail:"Error code: 403 — Forbidden",confirmText:"Go Back",cancelText:"Request Access",theme:"dark",onConfirm:()=>MediAlert.toast({type:"info",title:"Navigating back…"})})'>
            <svg viewBox="0 0 24 24" style="stroke:var(--gray-400);">
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
            Error (Dark Theme)
        </button>
        <button class="demo-btn" style="border-color:var(--gray-200);"
            onclick='MediAlert.modal({type:"warning",title:"Suspend Doctor",message:"Suspending Dr. Carlos Mendez will block all upcoming appointments and restrict system access.",detail:"Patients will be notified automatically.",confirmText:"Suspend Account",cancelText:"Cancel",theme:"dark",onConfirm:()=>MediAlert.toast({type:"error",title:"Account suspended.",theme:"dark"})})'>
            <svg viewBox="0 0 24 24" style="stroke:var(--gray-400);">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
            </svg>
            Warning (Dark Theme)
        </button>
    </div>

    <!-- ═══════════════════════════════════
     MODAL CONTAINER (single, reused)
═══════════════════════════════════ -->
    <div class="modal-overlay" id="mediModalOverlay" onclick="MediAlert._handleOverlayClick(event)">
        <div class="modal-box" id="mediModalBox">
            <div class="modal-icon-area" id="mediModalIconArea"></div>
            <div class="modal-detail" id="mediModalDetail" style="display:none;"></div>
            <div class="modal-footer" id="mediModalFooter"></div>
        </div>
    </div>

    <!-- TOAST STACK -->
    <div class="toast-stack" id="toastStack"></div>

    <script src="../ts/alert.ts"></script>
</body>

</html>
